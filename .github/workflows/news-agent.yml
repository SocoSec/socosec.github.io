name: Daily news digest

on:
  schedule:
    - cron: "30 6 * * *" # every day at 06:30 UTC
  workflow_dispatch: {} # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Run news agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # optional
        run: python agent/news_agent.py

      - name: Commit new post
        run: |
          git config user.name "news-agent"
          git config user.email "actions@users.noreply.github.com"
          git add _posts agent/posted.json
          git diff --cached --quiet || git commit -m "digest: $(date -u +%F)"
          git push
