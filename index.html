:root{ --mono:"JetBrains Mono",ui-monospace,monospace; --accent:#ffb347; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d0907;color:#f3e9d8;font-family:var(--mono);overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- 3D room ---------- */
#c3d{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;outline:none;cursor:grab}
#c3d.drag{cursor:grabbing}
#c3d.point{cursor:pointer}
#cozy{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(20,8,0,.55) 100%),radial-gradient(ellipse at 30% 60%,rgba(255,150,60,.06),transparent 60%)}

#loading{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:#0b0806;transition:opacity .8s}
#loading.gone{opacity:0;pointer-events:none}
#loading div{font:20px "VT323",monospace;letter-spacing:.12em;color:#58ffb0;text-shadow:0 0 8px rgba(88,255,176,.7)}
#enter{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:13;font:600 12px var(--mono);letter-spacing:.2em;color:#f3e9d8;background:rgba(10,8,6,.7);border:1px solid rgba(255,255,255,.18);padding:9px 16px;border-radius:999px;pointer-events:none;animation:pulse 2.2s ease-in-out infinite;transition:opacity .5s}

#enter.gone,body.lofi #enter,body.focused #enter{opacity:0;animation:none}
#tip{position:fixed;z-index:14;pointer-events:none;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;
  background:rgba(8,6,4,.82);color:var(--accent);padding:5px 9px;border-radius:3px;opacity:0;transition:opacity .15s;white-space:nowrap}
#tip.on{opacity:1}
#toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%) translateY(10px);z-index:16;font:13px var(--mono);
  background:rgba(8,6,4,.86);border:1px solid rgba(255,255,255,.14);padding:9px 14px;border-radius:6px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#hint{position:fixed;left:18px;bottom:20px;z-index:12;font:12px var(--mono);letter-spacing:.06em;color:rgba(243,233,216,.72);text-shadow:0 1px 6px #000;line-height:1.7}
#hint b{color:#f3e9d8;border:1px solid rgba(255,255,255,.3);border-radius:3px;padding:0 4px;font-weight:600}
body.focused #hint{display:none}

/* ---------- top bar ---------- */
.top{position:fixed;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;padding:18px 26px;z-index:20;pointer-events:none}
.logo{font-family:"Archivo Black",sans-serif;letter-spacing:.06em;font-size:15px;pointer-events:auto;text-decoration:none;text-shadow:0 1px 8px #000}
nav{display:flex;gap:6px;pointer-events:auto}
nav button{font-size:19px;letter-spacing:.14em;padding:4px 12px;border-radius:4px;color:#e9dccb;text-shadow:0 1px 8px #000;transition:background .2s,color .2s}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{background:#f4ecd9;color:#111;text-shadow:none}

/* ---------- bottom bar ---------- */
.bottom{position:fixed;right:18px;bottom:16px;display:flex;gap:8px;z-index:20}
.chip{font-size:12px;letter-spacing:.12em;padding:7px 13px;border-radius:999px;background:rgba(10,8,6,.78);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px)}
.chip:hover{border-color:var(--accent)}
.chip.lit{border-color:var(--accent);color:var(--accent)}
#back{display:none}
body.focused #back{display:inline-block}

#tv{--g:#58ffb0;--ink:#04110b;--bg1:#103d2c;--bg2:#04110b;--sh:rgba(88,255,176,.7);
  position:fixed;z-index:12;display:none;flex-direction:column;overflow:hidden;
  background:radial-gradient(ellipse at center,var(--bg1),var(--bg2) 92%);color:var(--g);
  font-family:"VT323",monospace;line-height:1.1;text-shadow:0 0 6px var(--sh);box-shadow:inset 0 0 70px #000}
#tv.pc{--g:#ffbf5e;--ink:#1a0e02;--bg1:#3a2508;--bg2:#120a02;--sh:rgba(255,179,71,.65)}
#tv.on{display:flex;animation:tvon .6s ease-out}
#tv.off{display:flex;animation:tvoff .33s ease-in forwards}

@keyframes tvoff{0%{transform:none}60%{transform:scale(1,.006);filter:brightness(5)}100%{transform:scale(0,.006);opacity:0}}
#tv::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.22) 2px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45));animation:flick .12s infinite}
@keyframes flick{50%{opacity:.85}}
#tv .osd{display:flex;justify-content:space-between;align-items:center;padding:.6em 1.4em .2em;font-size:.95em;letter-spacing:.12em;flex:none}
#tv .osd.bot{padding:.3em 1.4em .7em}
#tv .osd button{font:inherit;color:inherit;letter-spacing:.12em;padding:0 .4em;border-radius:2px}
#tv .osd button:hover,#tv .osd button:focus-visible{background:var(--g);color:var(--ink);text-shadow:none;outline:none}
#tv .tvbody{flex:1;overflow:auto;padding:.3em 1.6em 1em;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--g) 45%,transparent) transparent}
#tv h1{font-size:2.5em;font-weight:400;line-height:.95;margin:.15em 0 .25em;letter-spacing:.02em}
#tv h2{font-size:.95em;font-weight:400;margin:1.1em 0 .3em;opacity:.65;letter-spacing:.1em;text-transform:uppercase}
#tv p{margin-bottom:.6em}
#tv .meta{opacity:.65;letter-spacing:.1em;text-transform:uppercase;font-size:.9em}
#tv .row{display:flex;justify-content:space-between;gap:1em;width:100%;text-align:left;padding:.12em .4em;margin-left:-.4em;
  font:inherit;color:inherit;text-decoration:none;border-radius:2px;text-shadow:inherit}
#tv .row:hover,#tv .row:focus-visible{background:var(--g);color:var(--ink);text-shadow:none;outline:none}
#tv .row span:last-child{opacity:.7;white-space:nowrap}
#tv .btn{display:inline-block;margin-top:.4em;text-decoration:none;padding:.05em .3em}
#tv .btn:hover{background:var(--g);color:var(--ink);text-shadow:none}
.glitch{animation:glitch .3s steps(3)}
@keyframes glitch{0%{opacity:.15;transform:translateX(-8px)}50%{opacity:.8;transform:translateX(5px) skewX(-5deg)}100%{opacity:1;transform:none}}

body.lofi #c3d,body.lofi #tv,body.lofi .bottom,body.lofi #hint,body.lofi #loading,body.lofi #tip,body.lofi #toast{display:none}

body.lofi nav button.on{background:none;color:var(--lf-accent);text-decoration:underline;text-underline-offset:6px}
.hdr-tools{display:none;gap:6px;margin-left:22px;pointer-events:auto}

@media (max-width:700px){

const A = { ctx:null, master:null, amb:null, noise:null, on:false, greeted:false };
function audioInit(){
  if (A.ctx) return;
  const ctx = new (window.AudioContext||window.webkitAudioContext)(); A.ctx = ctx;
  A.master = ctx.createGain(); A.master.connect(ctx.destination);
  const len = ctx.sampleRate*3, buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch=0; ch<2; ch++){ const d=buf.getChannelData(ch); let last=0; for (let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.2+w*.06; } }
  A.noise = buf;
  const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1700;
  A.amb = ctx.createGain(); A.amb.gain.value = 0;
  src.connect(lp).connect(A.amb).connect(A.master); src.start();
}
function env(g, t, a, peak, hold, rel){ g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.setValueAtTime(peak,t+a+hold); g.gain.exponentialRampToValueAtTime(.0001,t+a+hold+rel); }
function noiseThrough(filterType, f0, f1, t, dur, peak, q=1){
  const ctx=A.ctx, s=ctx.createBufferSource(); s.buffer=A.noise;
  const f=ctx.createBiquadFilter(); f.type=filterType; f.Q.value=q; f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=ctx.createGain(); env(g,t,dur*.15,peak,dur*.45,dur*.4);
  s.connect(f).connect(g).connect(A.master); s.start(t, Math.random()*2); s.stop(t+dur+.1);
}
function tone(type, f0, f1, t, dur, peak){
  const ctx=A.ctx, o=ctx.createOscillator(), g=ctx.createGain(); o.type=type;
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  env(g,t,.008,peak,dur*.2,dur*.8); o.connect(g).connect(A.master); o.start(t); o.stop(t+dur+.05);
}
function sfx(kind){
  if (!A.on || !A.ctx) return;
  const t = A.ctx.currentTime;
  if (kind==="sip"){                                   // slurp, gulp, mug back on the desk
    noiseThrough("bandpass", 700, 2600, t+.05, .55, .5, 4);
    noiseThrough("bandpass", 1800, 900, t+.35, .25, .25, 6);
    tone("sine", 230, 85, t+.78, .14, .45);
    tone("sine", 2650, 2500, t+1.45, .35, .08); tone("sine", 3900, 3800, t+1.45, .25, .04);
  } else if (kind==="thunder"){
    noiseThrough("lowpass", 900, 60, t, 3.2, 1.4, .7);
    noiseThrough("lowpass", 300, 40, t+.4, 2.6, 1.1, .7);
  } else if (kind==="insert"){ tone("square", 70, 45, t, .35, .06); noiseThrough("bandpass", 600, 200, t, .3, .2, 2); }
  else if (kind==="eject"){ tone("square", 45, 90, t, .3, .05); }
  else if (kind==="click"){ tone("square", 1800, 1200, t, .03, .05); }
  else { tone("sine", 880, 870, t, .08, .03); }
}
// little ticks of rain hitting the window
setInterval(()=>{ if (!A.on || document.hidden || !A.ctx) return;
  for (let i=0;i<3;i++) if (Math.random()<.55) setTimeout(()=>{ const t=A.ctx.currentTime; tone("sine", 2200+Math.random()*3400, 1800, t, .035, .012+Math.random()*.02); }, Math.random()*130);
}, 130);
// Prefer the natural-sounding neural voices browsers ship (Edge: "Microsoft … Online (Natural)", Chrome: "Google UK English Male")
// British male voices first: they carry the old-professor tone best
const VOICE_PREFS = [/Thomas.*Natural/i, /Ryan.*Natural/i, /Oliver.*Natural/i, /Alfie.*Natural/i, /Elliot.*Natural/i, /Natural.*English \(United Kingdom\)/i,
  /^Google UK English Male$/i, /Daniel/i, /George/i, /Brian.*Natural/i, /Christopher.*Natural/i, /Guy.*Natural/i, /Natural/i, /^Google US English$/i];
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  for (const re of VOICE_PREFS){ const v = vs.find(v => re.test(v.name)); if (v) return v; }
  return vs[0] || null;
}
function greet(){
  if (A.greeted) return; A.greeted = true; $("#enter").classList.add("gone");
  if (SITE.voice){
    const a = new Audio(SITE.voice); a.crossOrigin = "anonymous";
    try {                                   // a little room echo so the voice sounds like it's in the room
      const ctx = A.ctx, src = ctx.createMediaElementSource(a), warm = ctx.createBiquadFilter(); warm.type = "lowpass"; warm.frequency.value = 7500;
      const len = ctx.sampleRate*1.3, ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch=0; ch<2; ch++){ const d = ir.getChannelData(ch); for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 3.2); }
      const verb = ctx.createConvolver(); verb.buffer = ir; const wet = ctx.createGain(); wet.gain.value = .16; const dry = ctx.createGain(); dry.gain.value = .95;
      src.connect(warm); warm.connect(dry).connect(A.master); warm.connect(verb).connect(wet).connect(A.master);
    } catch(_) {}
    a.play().catch(()=>{}); A.voiceEl = a; return;
  }
  if (!("speechSynthesis" in window)) return;
  const say = () => {
    const u = new SpeechSynthesisUtterance(SITE.greeting); const v = pickVoice();
    if (v){ u.voice = v; u.lang = v.lang; }
    // slower, lower, unhurried: an old academic welcoming a guest
    u.rate = /Natural/i.test(v?.name||"") ? .86 : .82; u.pitch = /Natural/i.test(v?.name||"") ? .82 : .72; u.volume = .95;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) say();
  else { let done = false; speechSynthesis.onvoiceschanged = () => { if (done) return; done = true; speechSynthesis.onvoiceschanged = null; say(); }; setTimeout(()=>{ if (!done){ done = true; say(); } }, 900); }
}
function setSound(on){
  audioInit(); A.ctx.resume();
  A.on = on; A.amb.gain.setTargetAtTime(on ? .3 : 0, A.ctx.currentTime, .5);
  if (on) greet(); else { if ("speechSynthesis" in window) speechSynthesis.cancel(); if (A.voiceEl) A.voiceEl.pause(); }

}

  }
  async function closeScreen(fast=false){
    if (!playing){ if (!fast){ await flyTo(HOME.pos, HOME.target, 1.1); } S.mode = "room"; document.body.classList.remove("focused"); markNav(""); return; }
    const p = playing; playing = null; clearInterval(tcTimer);
    const tv = $("#tv"); if (tv.classList.contains("on")){ tv.className = "off " + p.kind; if (!fast) await wait(330); } tv.className = "";
    p.sc.S.set(IDLE[p.kind]);
    if (fast){ if (p.tape) homeTape(p.tape); return; }
    await flyTo(HOME.pos, HOME.target, 1.2);
    if (p.tape) await ejectTape(p.tape);
    S.mode = "room"; document.body.classList.remove("focused"); markNav(""); setHash("");
  }

  /* ---- render loop ---- */
  const clockT = new THREE.Clock(); let frameN = 0, lastSec = -1;
  function update(){
    const dt = Math.min(clockT.getDelta(), .05), t = clockT.elapsedTime; frameN++;
    const now = performance.now();
    S.tweens = S.tweens.filter(tw => { const k = Math.min(1, (now-tw.t0)/tw.dur); tw.fn(k); if (k >= 1){ tw.res(); return false; } return true; });
    if (S.tweens.length || frameN % 20 === 0) renderer.shadowMap.needsUpdate = true;
    if (S.mode === "room"){
      const f = forward(); f.y = 0; f.normalize(); const rgt = new THREE.Vector3(-f.z, 0, f.x); const mv = new THREE.Vector3();
      if (S.keys.w || S.keys.arrowup) mv.add(f); if (S.keys.s || S.keys.arrowdown) mv.sub(f);
      if (S.keys.d || S.keys.arrowright) mv.add(rgt); if (S.keys.a || S.keys.arrowleft) mv.sub(rgt);
      if (mv.lengthSq()){ mv.normalize().multiplyScalar(1.7*dt); S.pos.add(mv); S.pos.x = THREE.MathUtils.clamp(S.pos.x, -2.15, 2.3); S.pos.z = THREE.MathUtils.clamp(S.pos.z, -1.95, 2.55); }
      applyCam();
    }
    // rain
    for (let i=0;i<RN;i++){ const o=i*6, dy=rainV[i]*dt; rainPos[o+1]-=dy; rainPos[o+4]-=dy; rainPos[o]+=dt*1.2; rainPos[o+3]+=dt*1.2; if (rainPos[o+4] < rainBox.y0) resetDrop(i, false); }
    rainGeo.attributes.position.needsUpdate = true;
    if (frameN % 2 === 0) drawDrops();
    // lightning
    S.nextFlash -= dt; if (S.nextFlash < 0){ S.flash = 1.2; S.nextFlash = 14+Math.random()*26; setTimeout(()=>sfx("thunder"), 700+Math.random()*1600); }
    if (S.flash > 0){ S.flash -= dt*2.2; const f = Math.max(0, S.flash) * (Math.random() < .5 ? 1 : .35); flashLight.intensity = f*3; skyMat.color.setScalar(1+f*2.2); } else { flashLight.intensity = 0; skyMat.color.setScalar(1); }
    // tower sparkle + beacon, cars
    const col = spGeo.attributes.color; for (let i=0;i<SP;i++){ const on = Math.random() < .08; col.array[i*3]=on?1:1; col.array[i*3+1]=on?1:.72; col.array[i*3+2]=on?1:.35; } col.needsUpdate = true;
    beaconPivot.rotation.y = t*.5;
    cars.forEach(c=>{ c.s.position.x += c.v*dt; if (c.s.position.x > 25) c.s.position.x = -70; if (c.s.position.x < -70) c.s.position.x = 25; });
    // dust, steam, flicker
    for (let i=0;i<DN;i++){ dustPos[i*3+1] += Math.sin(t*.3+dustSeed[i])*.0006; dustPos[i*3] += Math.cos(t*.2+dustSeed[i])*.0004; } dustGeo.attributes.position.needsUpdate = true;
    steam.forEach(s=>{ s.userData.t = (s.userData.t + dt*.25) % 1; const k = s.userData.t; s.position.set(mug.position.x + Math.sin(k*6+s.id)*.015, mug.position.y+.11+k*.22, mug.position.z); s.scale.setScalar(.04+k*.08); s.material.opacity = Math.sin(k*Math.PI)*.22; });
    if (S.lampOn) lampLight.intensity = 5.2 + Math.sin(t*13)*.04;
    lampHalo.visible = S.lampOn;
    const fl = .82 + Math.sin(t*9.1)*.08 + Math.sin(t*23.7)*.05 + (Math.random()-.5)*.08;
    candleLight.intensity = 1.1*fl; flame.scale.set(.028+.004*fl, .045+.012*fl, 1); flame.position.x = Math.sin(t*3.1)*.002;
    for (const b of fairy){ const k = .7 + .3*Math.sin(t*1.6 + b.userData.ph); b.material.color.setRGB(.9*k, .66*k, .36*k); }
    tvGlow.intensity = .6 + Math.random()*.15;
    // screens + clocks
    if (frameN % 2 === 0){ tvS.tick(); pcS.tick(); }
    const sec = Math.floor(t); if (sec !== lastSec){ lastSec = sec; drawClock(); const d=new Date(), x=vcrClock.x; x.fillStyle="#020a06"; x.fillRect(0,0,128,40); x.fillStyle="#4dffb8"; x.font="32px 'VT323'"; x.fillText(d.toTimeString().slice(0,5), 22, 31); vcrClock.tex.needsUpdate = true; }
    if (playing && S.mode === "screen") overlayRect(playing.sc);
  }
  const resize = () => { renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    if (playing && S.mode === "screen"){ const v = screenView(playing.sc); camera.position.copy(v.pos); camera.lookAt(v.target); overlayRect(playing.sc); } };
  addEventListener("resize", resize);

  R = { renderer, scene, camera, S, running:false, openScreen, closeScreen, act, tapes,
    start(){ if (this.running) return; this.running = true; clockT.getDelta(); const loop = () => { if (!this.running) return; requestAnimationFrame(loop); update(); composer.render(); }; loop(); },
    stop(){ this.running = false; },
    snapshot(){ const keep = { p:camera.position.clone(), q:camera.quaternion.clone() }; camera.position.copy(HOME.pos); camera.lookAt(HOME.target); for (let i=0;i<3;i++){ drawDrops(); } tvS.n = tvS.total; tvS.draw(); composer.render();
      const url = renderer.domElement.toDataURL("image/jpeg", .86); camera.position.copy(keep.p); camera.quaternion.copy(keep.q); return url; }
  };
  // shadows only for things near the lamp, to keep it fast
  scene.traverse(o => { if (o.isMesh && o.position.z > 1.2 && !o.parent?.isGroup) o.castShadow = false; });
  resize();
  return R;
}

/* =================================================================
   navigation
   ================================================================= */
function go(k){
  k = ALIAS[k] || k;
  if (document.body.classList.contains("lofi")) return lofiGo(k, true);
  if (!R) return;
  if (k === "desk" || !SECTIONS[k]) return toDesk();
  if (busy) return;
  if (playing && playing.section === k) return;
  R.openScreen({ section:k }, SCREEN_OF[k], null).then(()=>{ if (playing) playing.section = k; });
}
function playTape(i, tapeMesh){
  if (busy || !R) return;
  R.openScreen({ item:i }, "tv", tapeMesh);
}
async function toDesk(){
  if (!R || busy) return;
  busy = true; try { await R.closeScreen(false); } finally { busy = false; }
}
document.addEventListener("click", e=>{
  const t = e.target.closest("#nav [data-go], #lofi [data-go]"); if (!t) return;
  e.preventDefault();
  if (document.body.classList.contains("lofi")) lofiGo(t.dataset.go, true); else go(t.dataset.go);
});
$("#back").onclick = toDesk;
$("#logo").onclick = e=>{ e.preventDefault(); document.body.classList.contains("lofi") ? lofiGo("desk", true) : toDesk(); };
addEventListener("keydown", e=>{ if (e.key === "Escape" && !document.body.classList.contains("lofi")) toDesk(); });

/* =================================================================
   lo-fi (static) version
   ================================================================= */
function buildLofi(){
  $("#lofiWrap").innerHTML = `<h1 class="hello">Hi, I'm ${esc(SITE.name)}.</h1>
    <p class="intro">${esc(SITE.intro)}</p>
    <a class="more" href="#about" data-go="about">More about me</a>
    <hr>
    <a class="snap" id="snap" href="#" aria-label="Walk into the 3D room"><span class="cta">▶ STEP INTO THE ROOM · HI-FI</span></a>
    <p class="note" id="lofiNote"></p>
    ${ORDER.map(k=>`<section class="lsec" id="lofi-${k}">${RENDER[k]()}</section>`).join("")}
    <footer class="foot"><span>© ${new Date().getFullYear()} Esmail Abdullah</span><span>built by hand · rain included</span></footer>`;
  $("#snap").onclick = e=>{ e.preventDefault(); setLofi(false); };
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if (e.isIntersecting && document.body.classList.contains("lofi")) markNav(e.target.id.slice(5)); }),
    { root: $("#lofi"), rootMargin: "-100px 0px -60% 0px" });
  ORDER.forEach(k=>io.observe(document.getElementById("lofi-"+k)));
}
function paintSnap(){ if (!R) return; try { $("#snap").style.backgroundImage = `url(${R.snapshot()})`; } catch(_) {} }
function lofiGo(k, smooth){
  k = ALIAS[k] || k;
  if (k==="desk"){ $("#lofi").scrollTo({top:0, behavior: smooth?"smooth":"auto"}); markNav(""); setHash(""); return; }
  const sec = document.getElementById("lofi-"+k); if (!sec) return;
  sec.scrollIntoView({behavior: smooth?"smooth":"auto"}); markNav(k); setHash(k);
}
function setDark(on, save){
  document.body.classList.toggle("dark", on); $("#themeBtn").setAttribute("aria-pressed", on ? "true" : "false");
  if (save) { try{ localStorage.setItem("theme", on?"dark":"light"); }catch(_){} }
}
async function enterRoom(){
  const ld = $("#loading"); ld.classList.remove("gone");
  try { await boot3D(); } catch (err) { console.error(err); toast("Your browser can't show the 3D room, here's the static version."); return setLofi(true); }
  R.start(); paintSnap(); requestAnimationFrame(()=>ld.classList.add("gone"));
}
function setLofi(on){
  document.body.classList.toggle("lofi", on);
  $("#lofiBtn").classList.toggle("lit", on);
  $("#lofiBtn").textContent = on ? "▶ INTERACTIVE" : "▤ LO-FI";
  $("#lofiNote").innerHTML = innerWidth<700
    ? `You're reading the static version because the 3D room works best on a bigger screen. <button id="tryInt">Try it anyway →</button>`
    : `You're reading the static version. <button id="tryInt">Step into the room →</button>`;
  $("#tryInt").onclick = ()=>setLofi(false);
  try{ localStorage.setItem("lofi", on?"1":"0"); }catch(_){}
  if (on){ if (R){ paintSnap(); R.stop(); } markNav(""); if (A.on) setSound(false); }
  else enterRoom();
}
$("#lofiBtn").onclick = ()=>setLofi(!document.body.classList.contains("lofi"));
$("#hifiBtn").onclick = ()=>setLofi(false);
$("#themeBtn").onclick = ()=>setDark(!document.body.classList.contains("dark"), true);

/* ---- start ---- */
buildLofi();
(function(){ let t=null; try{ t=localStorage.getItem("theme"); }catch(_){} setDark(t ? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches, false); })();
let pref=null; try{ pref=localStorage.getItem("lofi"); }catch(_){}
const startLofi = pref ? pref==="1" : innerWidth<700;
const startHash = (location.hash||"").slice(1), startAt = ALIAS[startHash] || startHash;
if (startLofi){
  setLofi(true);
  if (SECTIONS[startAt]) lofiGo(startAt, false);
  if (innerWidth >= 700) boot3D().then(paintSnap).catch(()=>{});
} else {
  setLofi(false);
  if (SECTIONS[startAt]) (async()=>{ while (!R || !R.running) await wait(100); await wait(600); go(startAt); })();
}
</script>
